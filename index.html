<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WePlay - Games, Fun, For Everyone</title>
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="site-header">
  <h1 class="wordmark"><span class="we">We</span><span class="play">Play</span></h1>
  <p class="banner">Games &middot; Fun &middot; For Everyone</p>
</header>

<main>
  <section class="carousel" aria-roledescription="carousel" aria-label="Games">
    <button class="arrow prev" type="button" aria-label="Previous game">&#8249;</button>
    <div class="stage" id="stage"><!-- cards rendered by portal.js --></div>
    <button class="arrow next" type="button" aria-label="Next game">&#8250;</button>
  </section>
  <div class="dots" id="dots" aria-label="Choose game"></div>
</main>

<footer class="site-footer">A world of fun awaits</footer>

<script src="portal.js"></script>
</body>
</html>
